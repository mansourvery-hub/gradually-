name: jianru
description: 渐入 — a zero-friction, monolingual Chinese reading-immersion app.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.34.4
  drift_flutter: ^0.3.1
  dart_jieba: ^1.0.1
  flutter_riverpod: ^3.4.3
  fsrs: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.34.6

flutter:
  uses-material-design: true
  assets:
    - assets/dict.dgz
    - assets/content/
